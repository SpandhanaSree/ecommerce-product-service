spring:
  application:
    name: product-service

  data:
    mongodb:
      host: localhost
      port: 27017
      database: product-db

jwt:
  secret: ${JWT_SECRET}
  validity:
    accessToken: 900000 
    refreshToken: 604800000

#These numbers are durations in milliseconds in our project's configuration
# 900000 milliseconds = 15 minutes
# 604800000 milliseconds = 7 days